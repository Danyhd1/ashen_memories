<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101a27">
  <title>Shattered Marches</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <main>
    <header>
      <h1>Shattered Marches</h1>
      <button id="installButton" hidden>Install</button>
    </header>

    <section id="statusPanel" aria-live="polite">
      <strong id="status">Create a party to begin.</strong>
      <span id="location"></span>
    </section>

    <section id="enemyPanel" hidden>
      <h2 id="enemyName"></h2>
      <meter id="enemyHealth" min="0" max="100" value="100"></meter>
    </section>

    <section id="partyPanel"></section>

    <nav id="movement" aria-label="Movement">
      <button data-direction="w" class="up">N</button>
      <button data-direction="a" class="left">W</button>
      <button data-direction="s" class="down">S</button>
      <button data-direction="d" class="right">E</button>
    </nav>

    <section id="actions">
      <button id="newButton">New Adventure</button>
      <button id="attackButton" disabled>Attack</button>
      <button id="saveButton">Save</button>
      <button id="loadButton">Load</button>
    </section>
  </main>

  <script src="/mobile.js"></script>
</body>
</html>
