plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.shatteredmarches.rpg"
    compileSdk 35

    defaultConfig {
        applicationId "com.shatteredmarches.rpg"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        dependencies {
            implementation "androidx.appcompat:appcompat:1.7.0"
            implementation "androidx.webkit:webkit:1.12.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.10"
    }
}

tasks.register("syncPythonRuntime", Copy) {
    from("${rootProject.projectDir}/../")
    include "*.py"
    include "data/**"
    include "maps/**"
    include "mobile.html"
    include "mobile.css"
    include "mobile.js"
    include "manifest.json"
    include "sw.js"
    into("${projectDir}/src/main/python")
}

tasks.named("preBuild").configure {
    dependsOn("syncPythonRuntime")
}
